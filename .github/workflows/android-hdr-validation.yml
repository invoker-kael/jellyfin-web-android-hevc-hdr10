name: Android HDR validation

on:
  push:
    branches:
      - codex/android-hevc-hdr10-policy

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - build:es-check
          - lint:changed
          - build:check
          - test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          check-latest: true

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run quality check
        if: matrix.command != 'lint:changed'
        run: npm run ${{ matrix.command }}

      - name: Lint changed JavaScript files
        if: matrix.command == 'lint:changed'
        run: >-
          npx eslint
          src/apps/dashboard/components/drawer/sections/ServerDrawerSection.tsx
          src/apps/dashboard/routes/_legacyRoutes.ts
          src/components/apphost.js
          src/components/playbackSettings/playbackSettings.js
          src/controllers/dashboard/androidhdr.js
          src/controllers/dashboard/playback.js
          src/scripts/androidHdr10.js
          src/scripts/androidHdr10.test.js
          src/scripts/browserDeviceProfile.js
          src/scripts/browserDeviceProfile.androidHdr10.test.js
          src/scripts/settings/userSettings.js
          src/scripts/settings/appSettings.js
          src/scripts/settings/appSettings.androidHdr10.test.js

  docker-image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: false

      - name: Build Jellyfin image archive
        env:
          JELLYFIN_WEB_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg JELLYFIN_WEB_COMMIT_SHA="$JELLYFIN_WEB_COMMIT_SHA" \
            --tag invokerkael/jellyfin-android-hevc-hdr10:10.10.7-android-hdr-formats-r4 \
            --output type=docker,dest=/tmp/jellyfin-android-hevc-hdr10.tar \
            --file Dockerfile.android-hdr .
          test -s /tmp/jellyfin-android-hevc-hdr10.tar

      - name: Upload image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jellyfin-android-hevc-hdr10-r4-image
          path: /tmp/jellyfin-android-hevc-hdr10.tar
          if-no-files-found: error
          retention-days: 1
