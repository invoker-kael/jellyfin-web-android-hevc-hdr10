<div id="androidHdrConfigurationPage" data-role="page" class="page type-interior playbackConfigurationPage" data-title="${AndroidHdrServerDefaults}">
    <div>
        <div class="content-primary">
            <form class="androidHdrConfigurationForm">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">${AndroidHdrServerDefaults}</h2>
                </div>
                <div class="fieldDescription">${AndroidHdrServerDefaultsHelp}</div>
                <div class="checkboxContainer">
                    <label>
                        <input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="HDR10" />
                        <span>${EnableAndroidHdr10AutoDetection}</span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="HLG" />
                        <span>${EnableAndroidHlgAutoDetection}</span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="DOVI" />
                        <span>${EnableAndroidDolbyVisionAutoDetection}</span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="DOVIWithHDR10" />
                        <span>${EnableAndroidDolbyVisionWithHdr10AutoDetection}</span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="DOVIWithHLG" />
                        <span>${EnableAndroidDolbyVisionWithHlgAutoDetection}</span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="DOVIWithSDR" />
                        <span>${EnableAndroidDolbyVisionWithSdrAutoDetection}</span>
                    </label>
                </div>
                <div><button is="emby-button" type="submit" class="raised button-submit block"><span>${Save}</span></button></div>
            </form>
        </div>
    </div>
</div>
