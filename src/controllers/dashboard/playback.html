<div id="playbackConfigurationPage" data-role="page" class="page type-interior playbackConfigurationPage" data-title="${ButtonResume}">
    <div>
        <div class="content-primary">
            <form class="playbackConfigurationForm">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">${ButtonResume}</h2>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="txtMinResumePct" name="txtMinResumePct" pattern="[0-9]*" required min="0" max="100" label="${LabelMinResumePercentage}"></input>
                    <div class="fieldDescription">
                        ${LabelMinResumePercentageHelp}
                    </div>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="txtMaxResumePct" name="txtMaxResumePct" pattern="[0-9]*" required min="1" max="100" label="${LabelMaxResumePercentage}"></input>
                    <div class="fieldDescription">
                        ${LabelMaxResumePercentageHelp}
                    </div>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="txtMinAudiobookResume" name="txtMinAudiobookResume" pattern="[0-9]*" required min="0" max="100" label="${LabelMinAudiobookResume}"></input>
                    <div class="fieldDescription">
                        ${LabelMinAudiobookResumeHelp}
                    </div>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="txtMaxAudiobookResume" name="txtMaxAudiobookResume" pattern="[0-9]*" required min="1" max="100" label="${LabelMaxAudiobookResume}"></input>
                    <div class="fieldDescription">
                        ${LabelMaxAudiobookResumeHelp}
                    </div>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="txtMinResumeDuration" name="txtMinResumeDuration" pattern="[0-9]*" required min="0" label="${LabelMinResumeDuration}"></input>
                    <div class="fieldDescription">
                        ${LabelMinResumeDurationHelp}
                    </div>
                </div>
                <h2 class="sectionTitle">${AndroidHdrServerDefaults}</h2>
                <div class="fieldDescription">${AndroidHdrServerDefaultsHelp}</div>
                <div class="checkboxContainer">
                    <label>
                        <input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="HDR10" />
                        <span>${EnableAndroidHdr10AutoDetection}</span>
                    </label>
                </div>
                <div class="checkboxContainer"><label><input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="HLG" /><span>${EnableAndroidHlgAutoDetection}</span></label></div>
                <div class="checkboxContainer"><label><input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="DOVI" /><span>${EnableAndroidDolbyVisionAutoDetection}</span></label></div>
                <div class="checkboxContainer"><label><input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="DOVIWithHDR10" /><span>${EnableAndroidDolbyVisionWithHdr10AutoDetection}</span></label></div>
                <div class="checkboxContainer"><label><input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="DOVIWithHLG" /><span>${EnableAndroidDolbyVisionWithHlgAutoDetection}</span></label></div>
                <div class="checkboxContainer"><label><input type="checkbox" is="emby-checkbox" class="chkAndroidHdrAutoDetection" data-video-range-type="DOVIWithSDR" /><span>${EnableAndroidDolbyVisionWithSdrAutoDetection}</span></label></div>
                <div><button is="emby-button" type="submit" class="raised button-submit block"><span>${Save}</span></button></div>
            </form>
        </div>
    </div>
</div>
